<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quebra cabeças 3x3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="screen-start" class="screen active" aria-labelledby="start-title">
        <div class="card">
          <p class="eyebrow">Quebra cabeças 3x3</p>
          <h1 id="start-title">Organize as pecas e revele a imagem.</h1>
          <p class="lead">
            Arraste as pecas disponiveis para o tabuleiro ate completar a imagem.
          </p>
          <button id="start-btn" class="primary">Iniciar jogo</button>
        </div>
      </section>

      <section id="screen-game" class="screen" aria-labelledby="game-title">
        <div class="card wide">
          <header class="game-header">
            <div>
              <p id="level-label" class="eyebrow">Fase 1 de 3</p>
              <h2 id="game-title">Fase 1</h2>
            </div>
            <div class="stats">
              <div>
                <span class="stat-label">Movimentos</span>
                <span id="move-count" class="stat-value">0</span>
              </div>
            </div>
          </header>

          <div class="game-body">
            <div class="board-wrap">
              <div id="board" class="board" role="grid" aria-label="Tabuleiro do puzzle"></div>
            </div>
            <aside class="side-panel">
              <div class="preview">
                <p class="preview-label">Imagem completa</p>
                <div
                  id="preview-image"
                  class="preview-image"
                  role="img"
                  aria-label="Imagem de referencia da fase"
                ></div>
              </div>
              <div class="tray-section">
                <p class="preview-label">Pecas disponiveis</p>
                <div id="tray" class="tray" role="list" aria-label="Pecas disponiveis para arrastar"></div>
              </div>
            </aside>
          </div>

          <div class="controls">
            <button id="restart-btn" class="ghost">Reiniciar fase</button>
          </div>
        </div>
      </section>

      <div id="level-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
          <header class="modal-header">
            <p class="eyebrow">Fase concluida</p>
            <h3 id="modal-title">Fase concluida</h3>
          </header>
          <div id="modal-body" class="modal-body">
            <div id="modal-text" class="modal-text"></div>
            <div id="modal-media" class="modal-media hidden">
              <video id="modal-video" class="modal-video hidden" controls></video>
              <div id="modal-embed" class="modal-embed hidden"></div>
            </div>
          </div>
          <div class="modal-actions">
            <button id="next-btn" class="primary">Proxima fase</button>
          </div>
        </div>
      </div>

      <section id="screen-end" class="screen" aria-labelledby="end-title">
        <div class="card">
          <p class="eyebrow">Fim de jogo</p>
          <h2 id="end-title">Voce completou todas as fases!</h2>
          <p class="lead">Quer tentar de novo?</p>
          <button id="replay-btn" class="primary">Jogar novamente</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
